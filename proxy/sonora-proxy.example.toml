# Copy to ~/.config/sonora-proxy/config.toml, or sonora-proxy.toml beside the binary.
# Credentials are plaintext. Do not commit your actual configuration.
user_agent = "SonoraProxy/0.1.0 (https://github.com/tonyredondo/Sonora)"

[server]
listen = "127.0.0.1:8089"
# Optional on loopback. Required (24+ characters) when listening on another interface.
# api_token = "your-own-long-random-token"
max_jobs = 64
max_tracks_per_job = 100
max_job_result_bytes = 4000000
job_retention_seconds = 3600

[cache]
# Relative paths are resolved from this TOML file, independently of the working directory.
# Omit path to use the user's platform cache directory under sonora-proxy/.
# path = "./cache/cache.sqlite"
max_bytes = 536870912
max_entries = 10000
negative_ttl_seconds = 300

[metadata]
# Permanent confirmed edits, separate from the provider cache. No TTL or LRU eviction.
# Defaults to the user's platform application-data directory under sonora-proxy/.
# macOS: ~/Library/Application Support/sonora-proxy/metadata.sqlite
# path = "./data/metadata.sqlite"
# When full, new copies remain pending on the phone; existing records are kept.
max_bytes = 5368709120

[network]
queue_capacity = 128
deadline_seconds = 60
timeout_seconds = 15
max_retries = 2
max_response_bytes = 10000000

[musicbrainz]
enabled = true
min_interval_ms = 1100
ttl_seconds = 604800

[acoustid]
enabled = true
# Register an application at https://acoustid.org/new-application before fingerprint lookups.
# client_key = "your-acoustid-application-key"
min_interval_ms = 350
ttl_seconds = 2592000

[lrclib]
enabled = true
min_interval_ms = 500
ttl_seconds = 2592000

[cover_art]
enabled = true
min_interval_ms = 1000
ttl_seconds = 7776000

[elevenlabs]
enabled = true
# Paid, opt-in forced alignment and Scribe v2 transcription. The iPhone never receives this provider credential.
# api_key = "your-elevenlabs-api-key"
min_interval_ms = 1000
# Derived audio analysis cache, keyed by canonical audio + job parameters/version.
ttl_seconds = 31536000

# Personal lyric explanations through this OS user's Codex ChatGPT session.
# Requires Codex CLI 0.162.0 or a compatible version. Never put a Codex token here.
[codex]
enabled = false
binary = "codex" # Use an absolute path for launchd.
[audio_character]
# Optional local Essentia runtime, installed separately with analysis/setup.py.
enabled = false
# python = "/absolute/path/to/analysis/.venv/bin/python"
# models = "/absolute/path/to/analysis/models"
